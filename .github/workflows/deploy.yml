name: Publish portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:
env:
  # Set to 'true' to restore the archived experiment and its navigation entries.
  PUBLISH_EXPERIMENTS: 'false'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Unpack website
        run: |
          cat portfolio-20261006.zip.part* > /tmp/site.zip
          echo 'a1419d8ec050fe38cf8ab4a1dc837c061259c8ac8c1893e841c229ba4381bdfe  /tmp/site.zip' | sha256sum -c -
          mkdir -p _site
          unzip -q /tmp/site.zip -d _site
          cat houtu-assets.zip.part* > /tmp/houtu.zip
          echo '368ae551899675e4e83dac2aa263aaa1c5c7a6ad6fe40e7470738d812dd28577  /tmp/houtu.zip' | sha256sum -c -
          unzip -q /tmp/houtu.zip -d _site
          cat motion-expansion.zip.part* > /tmp/motion.zip
          echo '1dc8f68ecfe3fb4037cce044cadaaa133622029d3ce8f21b094d63fc86fe5067  /tmp/motion.zip' | sha256sum -c -
          unzip -q /tmp/motion.zip -d _site
          cat motion-clean.zip.part* > /tmp/clean.zip
          echo '3fa7fe8f12670b4a7528b5cd85373b8dcf6e56bb3f4d8b15dd59540c7eae032d  /tmp/clean.zip' | sha256sum -c -
          unzip -oq /tmp/clean.zip -d _site
          cp index.html _site/index.html
          echo '0106ec5eafa99101c8cdcb3f2ed6a29735302c0a0fa5b5363185f514b045da3d  portfolio-polish.zip' | sha256sum -c -
          unzip -oq portfolio-polish.zip -d _site
      # Experiment overlay v46
      - name: Add interactive experiments
        if: env.PUBLISH_EXPERIMENTS == 'true'
        run: |
          cat experiments-v46.zip.part* > /tmp/experiments.zip
          echo '4b7e8c5284dd3ee46e9cc20f9a8d2f100a17307414ee27100744ef9c34651fd3  /tmp/experiments.zip' | sha256sum -c -
          unzip -oq /tmp/experiments.zip -d _site
          python3 install-experiments.py _site
      # Experiment overlay v47
      - name: Keep music as background accompaniment
        if: env.PUBLISH_EXPERIMENTS == 'true'
        run: |
          echo '36fe5bc71361af262c9370f4b4bd6bd89db2bf2d759ac7bb107613e557cbab6c  experiments-v47.zip' | sha256sum -c -
          unzip -oq experiments-v47.zip -d _site
          python3 install-experiments.py _site
      # Experiment overlay v48
      - name: Add optional hand overlay to artwork recordings
        if: env.PUBLISH_EXPERIMENTS == 'true'
        run: |
          echo 'd7aca4198fc821d57a99f6df3863a81e7ac3b168f961bb2ddfe9e3634af7f0bf  experiments-v48.zip' | sha256sum -c -
          unzip -oq experiments-v48.zip -d _site
          python3 install-experiments.py _site
      - name: Verify public experiments are absent
        if: env.PUBLISH_EXPERIMENTS != 'true'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          site = Path("_site")
          assert not (site / "experiments").exists(), "Experiment files must not be published"
          pages = [site / "index.html", *site.glob("work-*.html")]
          assert len(pages) == 8 and all(p.is_file() for p in pages), "Portfolio pages are incomplete"
          for page in pages:
              text = page.read_text(encoding="utf-8")
              assert not any(marker in text for marker in (
                  "experiments-nav", "/experiments/", "tidal-echoes",
              )), f"Experiment link remains in {page.name}"
          print("All 8 portfolio pages preserved; experiment routes and assets are absent.")
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
